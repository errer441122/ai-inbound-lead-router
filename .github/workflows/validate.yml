name: Validate Workflow & Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify n8n workflow JSON and 30-case benchmark CSV
        run: |
          python3 -c "import json; w=json.load(open('workflows/ai-inbound-lead-router.n8n.json')); assert len(w['nodes'])>=12 and w['connections']"
          python3 -c "import csv; rows=list(csv.DictReader(open('data/real-companies-benchmark.csv'))); assert len(rows)==30, len(rows)"
          test -f docs/field-ownership-matrix.md
          test -f docs/sop-inbound-lead-routing.md
          test -f prompts/icp-scoring-prompt.md
